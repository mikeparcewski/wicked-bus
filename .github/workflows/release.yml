name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@2346ba60a182b51b936804846f659784f6755181 # v1.2.0
    with:
      package_name: wicked-bus
      test_cmd: 'npm test && npm run typecheck'
      enable_sync_pr: true
    secrets: inherit
