# wicked-bus — CI caller.
# `npm run typecheck` compiles test/types/consumer.mts (a consumer-shaped file
# importing every symbol the hand-authored lib/*.d.ts declarations export)
# with tsc --noEmit under strict nodenext resolution, so the type
# declarations cannot drift from the runtime surface silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-ci.yml@201d42dfebac1306a8fc81fe559aee99bbdef0e2 # v1.3.2
    with:
      test_cmd: 'npm test && npm run typecheck'
