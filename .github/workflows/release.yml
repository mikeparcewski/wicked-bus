name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@2596ff1c048156ab8dd19d547c8539054d9f8e44 # v1.4.0
    with:
      package_name: wicked-bus
      test_cmd: 'npm test && npm run typecheck'
      enable_sync_pr: true
    secrets: inherit
