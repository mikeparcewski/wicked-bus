name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@962fb42eaab2d80801614da427ab609f58758dcb # v1.4.1
    with:
      package_name: wicked-bus
      test_cmd: 'npm test && npm run typecheck'
      enable_sync_pr: true
    secrets: inherit
