name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: mikeparcewski/wicked-ci/.github/workflows/node-release.yml@201d42dfebac1306a8fc81fe559aee99bbdef0e2 # v1.3.2
    with:
      package_name: wicked-bus
      test_cmd: 'npm test && npm run typecheck'
      enable_sync_pr: true
    secrets: inherit
